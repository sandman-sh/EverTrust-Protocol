<svg width="1200" height="400" viewBox="0 0 1200 400" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradients -->
    <radialGradient id="bgGlow" cx="50%" cy="30%" r="60%">
      <stop offset="0%" stop-color="#9333EA" stop-opacity="0.35"/>
      <stop offset="50%" stop-color="#581C87" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="shieldGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#C084FC" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#9333EA" stop-opacity="0"/>
    </radialGradient>

    <!-- Linear Gradients -->
    <linearGradient id="purpleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#C084FC"/>
      <stop offset="50%" stop-color="#A855F7"/>
      <stop offset="100%" stop-color="#7E22CE"/>
    </linearGradient>
    <linearGradient id="cardBorder" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#9333EA" stop-opacity="0.6"/>
      <stop offset="50%" stop-color="#C084FC" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#9333EA" stop-opacity="0.6"/>
    </linearGradient>
    <linearGradient id="pulseGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#A855F7" stop-opacity="0"/>
      <stop offset="30%" stop-color="#C084FC" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#FFFFFF"/>
      <stop offset="70%" stop-color="#C084FC" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#A855F7" stop-opacity="0"/>
    </linearGradient>

    <!-- Filter for neon glow -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    <filter id="subtleGlow" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Grid Pattern -->
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M 32 0 L 0 0 0 32" fill="none" stroke="rgba(255, 255, 255, 0.04)" stroke-width="1"/>
    </pattern>
  </defs>

  <!-- Background Base -->
  <rect width="1200" height="400" fill="#09090B"/>
  <rect width="1200" height="400" fill="url(#grid)"/>
  <circle cx="600" cy="120" r="450" fill="url(#bgGlow)"/>

  <!-- Outer Border Frame -->
  <rect x="1" y="1" width="1198" height="398" fill="none" stroke="url(#cardBorder)" stroke-width="1.5"/>

  <!-- Top Accent Line -->
  <line x1="0" y1="2" x2="1200" y2="2" stroke="url(#pulseGrad)" stroke-width="2"/>

  <!-- Header Category Badge -->
  <g transform="translate(435, 45)">
    <rect x="0" y="0" width="330" height="28" fill="#18181B" stroke="#9333EA" stroke-opacity="0.4" stroke-width="1"/>
    <circle cx="16" cy="14" r="3.5" fill="#10B981" filter="url(#subtleGlow)"/>
    <text x="30" y="18" fill="#C084FC" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="700" letter-spacing="2.5">STARKNET STRK20 PRIVACY RAIL</text>
  </g>

  <!-- Shield Protocol Icon -->
  <g transform="translate(564, 88)" filter="url(#glow)">
    <circle cx="36" cy="36" r="38" fill="url(#shieldGlow)"/>
    <rect x="8" y="8" width="56" height="56" fill="#121216" stroke="#A855F7" stroke-width="1.5"/>
    <path d="M36 20 L50 26 V37 C50 46 44 52 36 56 C28 52 22 46 22 37 V26 Z" fill="none" stroke="#C084FC" stroke-width="2.2" stroke-linejoin="round"/>
    <path d="M28 38 L33 38 L35 32 L38 43 L41 36 L44 38" fill="none" stroke="#FFFFFF" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Protocol Title -->
  <text x="600" y="210" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="44" letter-spacing="-0.5" fill="#FFFFFF">
    EVER<tspan fill="url(#purpleGrad)">TRUST</tspan> PROTOCOL
  </text>

  <!-- Protocol Tagline -->
  <text x="600" y="248" text-anchor="middle" font-family="'JetBrains Mono', 'Space Mono', monospace" font-size="14" font-weight="500" fill="#94A3B8" letter-spacing="1">
    Autonomous Confidential Wealth Succession &amp; Dead Man's Switch
  </text>

  <!-- EKG Waveform Pulse Decorator -->
  <path d="M 150 290 L 380 290 L 400 275 L 415 305 L 430 260 L 445 315 L 460 280 L 475 295 L 490 290 L 710 290 L 725 275 L 740 305 L 755 260 L 770 315 L 785 280 L 800 295 L 815 290 L 1050 290" 
        fill="none" stroke="url(#pulseGrad)" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Footer Feature Badges -->
  <g transform="translate(180, 332)">
    <!-- Badge 1 -->
    <rect x="0" y="0" width="180" height="30" fill="#121216" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
    <text x="90" y="19" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="600" fill="#C084FC" letter-spacing="0.5">🔒 STRK20 POOL</text>

    <!-- Badge 2 -->
    <rect x="220" y="0" width="180" height="30" fill="#121216" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
    <text x="310" y="19" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="600" fill="#C084FC" letter-spacing="0.5">💓 HEARTBEAT CADENCE</text>

    <!-- Badge 3 -->
    <rect x="440" y="0" width="180" height="30" fill="#121216" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
    <text x="530" y="19" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="600" fill="#C084FC" letter-spacing="0.5">🎭 POSEIDON ZK NOTES</text>

    <!-- Badge 4 -->
    <rect x="660" y="0" width="180" height="30" fill="#121216" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
    <text x="750" y="19" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="600" fill="#C084FC" letter-spacing="0.5">⚡ ZERO PAPER TRAIL</text>
  </g>
</svg>
